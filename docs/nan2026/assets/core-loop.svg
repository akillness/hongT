<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a4a1e"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b6b7a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="300" fill="#ffffff"/>
  <text x="12" y="24" font-size="15" font-weight="700" fill="#1a1a1a">Cinder Court · 코어 루프</text>
  <text x="12" y="44" font-size="11.5" fill="#666">웨이브를 정리할수록 다음 코호트는 더 크고 빠르게 도착한다</text>

  <!-- nodes -->
  <g>
    <rect x="20" y="80" width="150" height="62" rx="9" fill="#fdf3e7" stroke="#c98a3c" stroke-width="1.4"/>
    <text x="95" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#7a4a1e">웨이브 개시</text>
    <text x="95" y="126" font-size="11" text-anchor="middle" fill="#8a6134">코호트 증원 등장</text>
  </g>
  <g>
    <rect x="207" y="80" width="150" height="62" rx="9" fill="#fdf3e7" stroke="#c98a3c" stroke-width="1.4"/>
    <text x="282" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#7a4a1e">교전</text>
    <text x="282" y="126" font-size="11" text-anchor="middle" fill="#8a6134">간격 유지 · 타격</text>
  </g>
  <g>
    <rect x="394" y="80" width="150" height="62" rx="9" fill="#e9f5f8" stroke="#3c93a8" stroke-width="1.4"/>
    <text x="469" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#14606f">기름 배분</text>
    <text x="469" y="126" font-size="11" text-anchor="middle" fill="#2b7386">Nova 45 / Ward 30</text>
  </g>
  <g>
    <rect x="581" y="80" width="150" height="62" rx="9" fill="#e9f5f8" stroke="#3c93a8" stroke-width="1.4"/>
    <text x="656" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#14606f">드롭 회수</text>
    <text x="656" y="126" font-size="11" text-anchor="middle" fill="#2b7386">파편 · 기름 · 유물</text>
  </g>
  <g>
    <rect x="768" y="80" width="92" height="62" rx="9" fill="#f1f1f4" stroke="#8a8a95" stroke-width="1.4"/>
    <text x="814" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#3a3a44">웨이브</text>
    <text x="814" y="124" font-size="13" font-weight="700" text-anchor="middle" fill="#3a3a44">정리</text>
  </g>

  <!-- forward arrows -->
  <line x1="172" y1="111" x2="203" y2="111" stroke="#7a4a1e" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="359" y1="111" x2="390" y2="111" stroke="#7a4a1e" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="546" y1="111" x2="577" y2="111" stroke="#1b6b7a" stroke-width="1.6" marker-end="url(#ar2)"/>
  <line x1="733" y1="111" x2="764" y2="111" stroke="#1b6b7a" stroke-width="1.6" marker-end="url(#ar2)"/>

  <!-- feedback loop -->
  <path d="M814 146 L814 196 L95 196 L95 148" fill="none" stroke="#7a4a1e" stroke-width="1.6"
        stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <rect x="352" y="180" width="212" height="32" rx="7" fill="#ffffff" stroke="#c98a3c" stroke-width="1.2"/>
  <text x="458" y="201" font-size="11.5" text-anchor="middle" fill="#7a4a1e">2.15초 정비 · 스폰 간격 단축</text>

  <!-- fail path -->
  <path d="M282 144 L282 250 L640 250" fill="none" stroke="#a33" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ar)"/>
  <rect x="644" y="234" width="216" height="32" rx="7" fill="#fdeceb" stroke="#c05a52" stroke-width="1.2"/>
  <text x="752" y="255" font-size="11.5" text-anchor="middle" fill="#94322b">등불 무결성 0 → 런 종료 · R 재시작</text>
  <text x="292" y="230" font-size="11" fill="#a33">피격 누적</text>
</svg>
