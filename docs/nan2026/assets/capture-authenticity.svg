<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <defs>
    <marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e5c2c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#ffffff"/>
  <text x="12" y="24" font-size="15" font-weight="700" fill="#1a1a1a">플레이 영상의 진정성 — 채택한 경로와 배제한 경로</text>
  <text x="12" y="44" font-size="11.5" fill="#666">대회 규정: AI를 이용한 조작·합성 불가, 실제 플레이 화면 그대로.</text>

  <!-- rejected -->
  <rect x="14" y="62" width="852" height="86" rx="10" fill="#fdeceb" stroke="#c05a52" stroke-width="1.4"/>
  <text x="32" y="86" font-size="12.5" font-weight="700" fill="#94322b">✕ 배제 — 스크린샷 합성 렌더링</text>
  <text x="32" y="108" font-size="11.5" fill="#8a3d36">스크린샷을 이어붙이고 가상 커서·줌·클릭 연출을 얹어 데모 영상을 만드는 방식. 사내 도구로 가능했으나 사용하지 않았다.</text>
  <text x="32" y="130" font-size="11.5" font-weight="700" fill="#94322b">이유: 규정이 금지하는 &quot;합성&quot;에 정확히 해당한다.</text>

  <!-- adopted -->
  <rect x="14" y="164" width="852" height="182" rx="10" fill="#f3f8f4" stroke="#2f7d3f" stroke-width="1.6"/>
  <text x="32" y="188" font-size="12.5" font-weight="700" fill="#1e5c2c">✓ 채택 — 실입력 · 실프레임 캡처</text>

  <g>
    <rect x="32" y="204" width="176" height="76" rx="8" fill="#ffffff" stroke="#5a8f68" stroke-width="1.2"/>
    <text x="120" y="228" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e5c2c">실제 브라우저</text>
    <text x="120" y="248" font-size="10.5" text-anchor="middle" fill="#2c5c38">정적 서버 + Chromium이</text>
    <text x="120" y="265" font-size="10.5" text-anchor="middle" fill="#2c5c38">실제 게임 페이지 로드</text>
  </g>
  <g>
    <rect x="240" y="204" width="196" height="76" rx="8" fill="#ffffff" stroke="#5a8f68" stroke-width="1.2"/>
    <text x="338" y="228" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e5c2c">CDP 실입력</text>
    <text x="338" y="248" font-size="10.5" text-anchor="middle" fill="#2c5c38">Input.dispatchKeyEvent —</text>
    <text x="338" y="265" font-size="10.5" text-anchor="middle" fill="#2c5c38">물리 키보드와 동일 경로</text>
  </g>
  <g>
    <rect x="468" y="204" width="196" height="76" rx="8" fill="#ffffff" stroke="#5a8f68" stroke-width="1.2"/>
    <text x="566" y="228" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e5c2c">관측 전용 판단</text>
    <text x="566" y="248" font-size="10.5" text-anchor="middle" fill="#2c5c38">렌더 스냅샷 + HUD 텍스트만</text>
    <text x="566" y="265" font-size="10.5" text-anchor="middle" fill="#2c5c38">내부 상태 write 없음</text>
  </g>
  <g>
    <rect x="696" y="204" width="152" height="76" rx="8" fill="#ffffff" stroke="#5a8f68" stroke-width="1.2"/>
    <text x="772" y="228" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e5c2c">실프레임 인코딩</text>
    <text x="772" y="248" font-size="10.5" text-anchor="middle" fill="#2c5c38">브라우저가 실제로</text>
    <text x="772" y="265" font-size="10.5" text-anchor="middle" fill="#2c5c38">렌더한 프레임 그대로</text>
  </g>

  <line x1="210" y1="242" x2="236" y2="242" stroke="#1e5c2c" stroke-width="1.5" marker-end="url(#c1)"/>
  <line x1="438" y1="242" x2="464" y2="242" stroke="#1e5c2c" stroke-width="1.5" marker-end="url(#c1)"/>
  <line x1="666" y1="242" x2="692" y2="242" stroke="#1e5c2c" stroke-width="1.5" marker-end="url(#c1)"/>

  <rect x="32" y="296" width="816" height="34" rx="7" fill="#ffffff" stroke="#2f7d3f" stroke-width="1.2"/>
  <text x="48" y="318" font-size="11.5" fill="#1e5c2c">
    보간 · 리타이밍 · 합성 · 생성 없음 · 재현 명령: node scripts/capture-cinder-court-play.mjs --seconds 44
  </text>
</svg>
