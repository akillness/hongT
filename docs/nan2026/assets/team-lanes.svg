  <line x1="152" y1="118" x2="152" y2="128" stroke="#55555f" stroke-width="1.4" marker-end="url(#t1)"/>
  <line x1="440" y1="118" x2="440" y2="128" stroke="#55555f" stroke-width="1.4" marker-end="url(#t1)"/>
  <line x1="728" y1="118" x2="728" y2="128" stroke="#55555f" stroke-width="1.4" marker-end="url(#t1)"/>

