<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Abyssal Lantern — Cinder Court</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="apple-touch-icon" href="app-icon-192.png">
    <link rel="stylesheet" href="TemplateData/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
      /* mobile-layout spec #10-#13: brand letterbox + responsive canvas */
      html, body { background: #050812; }
      #unity-canvas { background: #050812; touch-action: none; }
      /* Desktop / wide: letterbox preserving 1280:853 (~3:2), never overflow
         the viewport (spec #12 — fixes sub-1280 windows + iPadOS desktop UA). */
      #unity-canvas.unity-responsive {
        width: min(1280px, 100vw, calc(100vh * 1280 / 853));
        height: auto;
        aspect-ratio: 1280 / 853;
      }
      /* Narrow viewports (~phones reporting desktop UA): fill (spec #13 —
         3D perspective renders any aspect; camera aspect-widen keeps the
         arena visible; HUD corner-anchors adapt). */
      @media (max-width: 500px) {
        #unity-container.unity-desktop {
          left: 0; top: 0; transform: none;
          position: fixed; width: 100%; height: 100%;
        }
        #unity-canvas.unity-responsive {
          width: 100%; height: 100%; aspect-ratio: auto;
        }
        #unity-footer { display: none; }
      }
      /* Notch safe-area (spec #10): pad the mobile container, not the canvas —
         canvas padding would skew the WebGL pointer mapping. */
      #unity-container.unity-mobile {
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
                 env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box; background: #050812;
      }
    </style>
  <meta property="og:type" content="website">
    <meta property="og:title" content="Abyssal Lantern — Cinder Court">
    <meta property="og:description" content="A dark fantasy dungeon crawl as the Lantern Reaver through Cinder Court.">
    <meta property="og:image" content="./cinder-court-link-preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Abyssal Lantern — Cinder Court">
    <meta name="twitter:description" content="A dark fantasy dungeon crawl as the Lantern Reaver through Cinder Court.">
    <meta name="twitter:image" content="./cinder-court-link-preview.png">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1280 height=853 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Abyssal Lantern — Cinder Court</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      /* CinderCourt OS reduced-motion hint (integrated-combat-vfx-spec §2.4):
         mirrored into localStorage on every load, before the Unity loader,
         so ViewPrefs can seed its default when the player never chose.
         An explicit lobby toggle (PlayerPrefs key) always wins. */
      try {
        window.localStorage.setItem("al:os-reduced-motion",
          window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "1" : "0");
      } catch (e) { /* storage unavailable: C# default (off) applies */ }

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      /* CinderCourt WebGL build cache version: 242a51ab003ab79f */
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/build-webgl.loader.js?v=242a51ab003ab79f";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/build-webgl.data.unityweb?v=242a51ab003ab79f",
        frameworkUrl: buildUrl + "/build-webgl.framework.js.unityweb?v=242a51ab003ab79f",
        codeUrl: buildUrl + "/build-webgl.wasm.unityweb?v=242a51ab003ab79f",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "HongT",
        productName: "Abyssal Lantern — Cinder Court",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      /* CinderCourt fixed WebGL backing store */
      config.matchWebGLToCanvasSize = false;

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.classList.add("unity-responsive");
      }

      function setUnityBackingStoreSize() {
        var rect = canvas.getBoundingClientRect();
        var scale = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.round(rect.width * scale));
        canvas.height = Math.max(1, Math.round(rect.height * scale));
      }
      var backingStoreResizeRequest = 0;
      function queueUnityBackingStoreSize() {
        if (backingStoreResizeRequest)
          window.cancelAnimationFrame(backingStoreResizeRequest);
        backingStoreResizeRequest = window.requestAnimationFrame(function() {
          backingStoreResizeRequest = 0;
          setUnityBackingStoreSize();
        });
      }
      window.addEventListener("resize", queueUnityBackingStoreSize);
      window.addEventListener("orientationchange", queueUnityBackingStoreSize);
      if (window.visualViewport)
        window.visualViewport.addEventListener("resize", queueUnityBackingStoreSize);
      setUnityBackingStoreSize();

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                unityShowBanner(message, "error");
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
